<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代课发布管理 - 校园综合服务平台</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --surface: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --brand: #0d9488;
            --brand-soft: #ccfbf1;
            --demand: #2563eb;
            --demand-soft: #dbeafe;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
        header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
        .topbar { max-width: 1200px; margin: 0 auto; padding: 1rem 5%; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        .logo { font-size: 1.2rem; font-weight: 700; color: #2563eb; text-decoration: none; }
        .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
        .btn { border: none; border-radius: 999px; padding: 0.5rem 1rem; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; }
        .btn-outline { color: #1f2937; background: #f3f4f6; }
        .btn-brand { color: #fff; background: var(--brand); }

        .container { max-width: 1200px; margin: 0 auto; padding: 1.3rem 5% 2rem; display: grid; gap: 1rem; }
        .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.8rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; }
        .card h3 { margin: 0; color: var(--muted); font-size: 0.95rem; }
        .card .num { margin-top: 0.4rem; font-size: 1.7rem; font-weight: 700; }

        .grid { display: grid; gap: 1rem; grid-template-columns: 1fr 1fr; }
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; }
        .panel h2 { margin: 0 0 0.8rem; font-size: 1.05rem; }
        .hint { margin: 0; color: var(--muted); font-size: 0.85rem; }
        .form-group { margin-bottom: 0.8rem; }
        .form-group label { display: block; margin-bottom: 0.3rem; font-size: 0.85rem; color: var(--muted); }
        .form-group input, .form-group textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.55rem 0.65rem;
            font-size: 0.9rem;
            font-family: inherit;
        }
        .form-group textarea { min-height: 88px; resize: vertical; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
        .form-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
        .btn-business { background: var(--brand); color: #fff; }
        .btn-demand { background: var(--demand); color: #fff; }

        .list-wrap { display: grid; gap: 1rem; grid-template-columns: 1fr 1fr; }
        .order-list { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; }
        .order-list h3 { margin: 0 0 0.8rem; font-size: 1rem; }
        .order-item { border: 1px solid var(--border); border-radius: 10px; padding: 0.7rem; margin-bottom: 0.7rem; }
        .order-item:last-child { margin-bottom: 0; }
        .order-item.business { border-left: 4px solid var(--brand); background: #f0fdfa; }
        .order-item.demand { border-left: 4px solid var(--demand); background: #eff6ff; }
        .order-title { margin: 0 0 0.3rem; font-weight: 700; }
        .order-meta { margin: 0.1rem 0; color: #374151; font-size: 0.86rem; }
        .order-muted { color: var(--muted); font-size: 0.8rem; }
        .order-actions { margin-top: 0.4rem; }
        .order-btn { border: none; background: #ef4444; color: #fff; border-radius: 8px; padding: 0.35rem 0.6rem; cursor: pointer; font-size: 0.8rem; }
        .empty { color: var(--muted); font-size: 0.9rem; }

        @media (max-width: 980px) {
            .grid, .list-wrap, .row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="topbar">
            <a href="substitute.html" class="logo">代课发布管理</a>
            <div class="actions">
                <a href="substitute.html" class="btn btn-outline">返回代课页</a>
                <a href="main.html" class="btn btn-brand">返回大厅</a>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="summary">
            <article class="card">
                <h3>代课商单数量</h3>
                <div class="num" id="businessCount">0</div>
            </article>
            <article class="card">
                <h3>代课需求数量</h3>
                <div class="num" id="demandCount">0</div>
            </article>
        </section>

        <section class="grid">
            <article class="panel">
                <h2>发布代课商单</h2>
                <p class="hint">用于发布明确预算和时间的代课商单。</p>
                <form id="businessForm">
                    <div class="form-group">
                        <label for="businessTitle">商单标题</label>
                        <input id="businessTitle" type="text" placeholder="例如：高数代课两节课">
                    </div>
                    <div class="row">
                        <div class="form-group">
                            <label for="businessTime">上课时间</label>
                            <input id="businessTime" type="datetime-local">
                        </div>
                        <div class="form-group">
                            <label for="businessBudget">预算/酬金</label>
                            <input id="businessBudget" type="text" placeholder="例如：80元">
                        </div>
                    </div>
                    <div class="row">
                        <div class="form-group">
                            <label for="businessLocation">地点</label>
                            <input id="businessLocation" type="text" placeholder="例如：教2-305">
                        </div>
                        <div class="form-group">
                            <label for="businessContact">联系方式</label>
                            <input id="businessContact" type="text" placeholder="例如：vx:xxx">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="businessDesc">详细说明</label>
                        <textarea id="businessDesc" placeholder="课程内容、注意事项、要求等"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-business">发布商单</button>
                    </div>
                </form>
            </article>

            <article class="panel">
                <h2>发布代课需求</h2>
                <p class="hint">用于发布一般求助类需求，不强调商单性质。</p>
                <form id="demandForm">
                    <div class="form-group">
                        <label for="demandTitle">需求标题</label>
                        <input id="demandTitle" type="text" placeholder="例如：周五下午代签到">
                    </div>
                    <div class="row">
                        <div class="form-group">
                            <label for="demandTime">时间</label>
                            <input id="demandTime" type="datetime-local">
                        </div>
                        <div class="form-group">
                            <label for="demandReward">感谢方式/预算</label>
                            <input id="demandReward" type="text" placeholder="例如：奶茶+20元">
                        </div>
                    </div>
                    <div class="row">
                        <div class="form-group">
                            <label for="demandLocation">地点</label>
                            <input id="demandLocation" type="text" placeholder="例如：阶梯教室3">
                        </div>
                        <div class="form-group">
                            <label for="demandContact">联系方式</label>
                            <input id="demandContact" type="text" placeholder="例如：QQ:xxx">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="demandDesc">需求说明</label>
                        <textarea id="demandDesc" placeholder="希望他人帮忙完成的事项"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-demand">发布需求</button>
                    </div>
                </form>
            </article>
        </section>

        <section class="list-wrap">
            <article class="order-list">
                <h3>我发布的代课商单</h3>
                <div id="businessList" class="empty">暂无商单</div>
            </article>

            <article class="order-list">
                <h3>我发布的代课需求</h3>
                <div id="demandList" class="empty">暂无需求</div>
            </article>
        </section>
    </main>

    <script src="../js/api-utils.js"></script>
    <script>
        const STORAGE_KEYS = {
            business: 'substitute_business_orders',
            demand: 'substitute_demand_orders'
        };

        function readList(key) {
            const raw = localStorage.getItem(key);
            if (!raw) return [];
            try {
                const list = JSON.parse(raw);
                return Array.isArray(list) ? list : [];
            } catch (error) {
                return [];
            }
        }

        function writeList(key, list) {
            localStorage.setItem(key, JSON.stringify(list));
        }

        function fmtTime(value) {
            if (!value) return '-';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return value;
            return date.toLocaleString('zh-CN', { hour12: false });
        }

        function renderCounts() {
            document.getElementById('businessCount').textContent = readList(STORAGE_KEYS.business).length;
            document.getElementById('demandCount').textContent = readList(STORAGE_KEYS.demand).length;
        }

        function renderOneList(targetId, type, data) {
            const el = document.getElementById(targetId);
            if (!data.length) {
                el.className = 'empty';
                el.textContent = type === 'business' ? '暂无商单' : '暂无需求';
                return;
            }

            el.className = '';
            el.innerHTML = data.map((item) => `
                <article class="order-item ${type}">
                    <p class="order-title">${item.title}</p>
                    <p class="order-meta">时间：${fmtTime(item.time)} | 地点：${item.location || '-'}</p>
                    <p class="order-meta">${type === 'business' ? '预算' : '感谢方式'}：${item.reward || '-'}</p>
                    <p class="order-meta">联系：${item.contact || '-'}</p>
                    <p class="order-meta">${item.desc || '-'}</p>
                    <p class="order-muted">发布于：${item.createdAt}</p>
                    <div class="order-actions">
                        <button class="order-btn" data-type="${type}" data-id="${item.id}">删除</button>
                    </div>
                </article>
            `).join('');
        }

        function renderLists() {
            const business = readList(STORAGE_KEYS.business);
            const demand = readList(STORAGE_KEYS.demand);
            renderOneList('businessList', 'business', business);
            renderOneList('demandList', 'demand', demand);
            renderCounts();
        }

        function createOrder(formValues) {
            return {
                id: Date.now() + Math.floor(Math.random() * 1000),
                ...formValues,
                createdAt: new Date().toLocaleString('zh-CN', { hour12: false })
            };
        }

        function submitBusiness(event) {
            event.preventDefault();
            const title = document.getElementById('businessTitle').value.trim();
            const time = document.getElementById('businessTime').value;
            const reward = document.getElementById('businessBudget').value.trim();
            const location = document.getElementById('businessLocation').value.trim();
            const contact = document.getElementById('businessContact').value.trim();
            const desc = document.getElementById('businessDesc').value.trim();

            if (!title || !time || !reward) {
                showMessage('请至少填写商单标题、时间和预算', 'warning');
                return;
            }

            const list = readList(STORAGE_KEYS.business);
            list.unshift(createOrder({ title, time, reward, location, contact, desc }));
            writeList(STORAGE_KEYS.business, list);
            event.target.reset();
            renderLists();
            showMessage('代课商单发布成功', 'success');
        }

        function submitDemand(event) {
            event.preventDefault();
            const title = document.getElementById('demandTitle').value.trim();
            const time = document.getElementById('demandTime').value;
            const reward = document.getElementById('demandReward').value.trim();
            const location = document.getElementById('demandLocation').value.trim();
            const contact = document.getElementById('demandContact').value.trim();
            const desc = document.getElementById('demandDesc').value.trim();

            if (!title || !time) {
                showMessage('请至少填写需求标题和时间', 'warning');
                return;
            }

            const list = readList(STORAGE_KEYS.demand);
            list.unshift(createOrder({ title, time, reward, location, contact, desc }));
            writeList(STORAGE_KEYS.demand, list);
            event.target.reset();
            renderLists();
            showMessage('代课需求发布成功', 'success');
        }

        function deleteOrder(type, id) {
            const key = type === 'business' ? STORAGE_KEYS.business : STORAGE_KEYS.demand;
            const next = readList(key).filter((item) => Number(item.id) !== Number(id));
            writeList(key, next);
            renderLists();
            showMessage('已删除该条发布', 'info');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderLists();
            document.getElementById('businessForm').addEventListener('submit', submitBusiness);
            document.getElementById('demandForm').addEventListener('submit', submitDemand);
            document.getElementById('businessList').addEventListener('click', (event) => {
                const target = event.target;
                if (target.tagName === 'BUTTON' && target.dataset.id) {
                    deleteOrder(target.dataset.type, target.dataset.id);
                }
            });
            document.getElementById('demandList').addEventListener('click', (event) => {
                const target = event.target;
                if (target.tagName === 'BUTTON' && target.dataset.id) {
                    deleteOrder(target.dataset.type, target.dataset.id);
                }
            });
        });
    </script>
</body>
</html>
