<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二手发布管理 - 校园综合服务平台</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --surface: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --brand: #2563eb;
            --brand-soft: #dbeafe;
            --need: #f97316;
            --need-soft: #ffedd5;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
        header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
        .topbar { max-width: 1200px; margin: 0 auto; padding: 1rem 5%; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        .logo { font-size: 1.2rem; font-weight: 700; color: #2563eb; text-decoration: none; }
        .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
        .btn { border: none; border-radius: 999px; padding: 0.5rem 1rem; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; }
        .btn-outline { color: #1f2937; background: #f3f4f6; }
        .btn-brand { color: #fff; background: var(--brand); }

        .container { max-width: 1200px; margin: 0 auto; padding: 1.3rem 5% 2rem; display: grid; gap: 1rem; }
        .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.8rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; }
        .card h3 { margin: 0; color: var(--muted); font-size: 0.95rem; }
        .card .num { margin-top: 0.4rem; font-size: 1.7rem; font-weight: 700; }

        .grid { display: grid; gap: 1rem; grid-template-columns: 1fr 1fr; }
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; }
        .panel h2 { margin: 0 0 0.8rem; font-size: 1.05rem; }
        .hint { margin: 0; color: var(--muted); font-size: 0.85rem; }
        .form-group { margin-bottom: 0.8rem; }
        .form-group label { display: block; margin-bottom: 0.3rem; font-size: 0.85rem; color: var(--muted); }
        .form-group input, .form-group textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.55rem 0.65rem;
            font-size: 0.9rem;
            font-family: inherit;
        }
        .form-group textarea { min-height: 88px; resize: vertical; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
        .form-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
        .btn-sell { background: var(--brand); color: #fff; }
        .btn-need { background: var(--need); color: #fff; }

        .list-wrap { display: grid; gap: 1rem; grid-template-columns: 1fr 1fr; }
        .order-list { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; }
        .order-list h3 { margin: 0 0 0.8rem; font-size: 1rem; }
        .order-item { border: 1px solid var(--border); border-radius: 10px; padding: 0.7rem; margin-bottom: 0.7rem; }
        .order-item:last-child { margin-bottom: 0; }
        .order-item.sell { border-left: 4px solid var(--brand); background: #eff6ff; }
        .order-item.need { border-left: 4px solid var(--need); background: #fff7ed; }
        .order-title { margin: 0 0 0.3rem; font-weight: 700; }
        .order-meta { margin: 0.1rem 0; color: #374151; font-size: 0.86rem; }
        .order-muted { color: var(--muted); font-size: 0.8rem; }
        .order-actions { margin-top: 0.4rem; }
        .order-btn { border: none; background: #ef4444; color: #fff; border-radius: 8px; padding: 0.35rem 0.6rem; cursor: pointer; font-size: 0.8rem; }
        .empty { color: var(--muted); font-size: 0.9rem; }

        @media (max-width: 980px) {
            .grid, .list-wrap, .row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="topbar">
            <a href="secondhand.html" class="logo">二手发布管理</a>
            <div class="actions">
                <a href="secondhand.html" class="btn btn-outline">返回二手页</a>
                <a href="main.html" class="btn btn-brand">返回大厅</a>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="summary">
            <article class="card">
                <h3>二手物品商单数量</h3>
                <div class="num" id="sellCount">0</div>
            </article>
            <article class="card">
                <h3>二手需求商单数量</h3>
                <div class="num" id="needCount">0</div>
            </article>
        </section>

        <section class="grid">
            <article class="panel">
                <h2>发布二手物品商单</h2>
                <p class="hint">用于发布“我有闲置要出售”的二手物品商单。</p>
                <form id="sellForm">
                    <div class="form-group">
                        <label for="sellTitle">商单标题</label>
                        <input id="sellTitle" type="text" placeholder="例如：九成新 iPad 闲置出售">
                    </div>
                    <div class="row">
                        <div class="form-group">
                            <label for="sellPrice">售价/预算</label>
                            <input id="sellPrice" type="text" placeholder="例如：1500元">
                        </div>
                        <div class="form-group">
                            <label for="sellCategory">物品分类</label>
                            <input id="sellCategory" type="text" placeholder="例如：数码电子">
                        </div>
                    </div>
                    <div class="row">
                        <div class="form-group">
                            <label for="sellLocation">交易地点</label>
                            <input id="sellLocation" type="text" placeholder="例如：一食堂门口">
                        </div>
                        <div class="form-group">
                            <label for="sellContact">联系方式</label>
                            <input id="sellContact" type="text" placeholder="例如：vx:xxx">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="sellDesc">物品描述</label>
                        <textarea id="sellDesc" placeholder="成色、配件、购买时间、交易说明等"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-sell">发布二手商单</button>
                    </div>
                </form>
            </article>

            <article class="panel">
                <h2>发布二手需求商单</h2>
                <p class="hint">用于发布“我想求购某物品”的需求商单。</p>
                <form id="needForm">
                    <div class="form-group">
                        <label for="needTitle">需求标题</label>
                        <input id="needTitle" type="text" placeholder="例如：求购高数教材上下册">
                    </div>
                    <div class="row">
                        <div class="form-group">
                            <label for="needBudget">预期预算</label>
                            <input id="needBudget" type="text" placeholder="例如：50元以内">
                        </div>
                        <div class="form-group">
                            <label for="needCategory">需求分类</label>
                            <input id="needCategory" type="text" placeholder="例如：教材书籍">
                        </div>
                    </div>
                    <div class="row">
                        <div class="form-group">
                            <label for="needLocation">期望交易地点</label>
                            <input id="needLocation" type="text" placeholder="例如：图书馆附近">
                        </div>
                        <div class="form-group">
                            <label for="needContact">联系方式</label>
                            <input id="needContact" type="text" placeholder="例如：QQ:xxx">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="needDesc">需求说明</label>
                        <textarea id="needDesc" placeholder="对成色、版本、交付时间等要求"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-need">发布需求商单</button>
                    </div>
                </form>
            </article>
        </section>

        <section class="list-wrap">
            <article class="order-list">
                <h3>我发布的二手物品商单</h3>
                <div id="sellList" class="empty">暂无二手商单</div>
            </article>
            <article class="order-list">
                <h3>我发布的二手需求商单</h3>
                <div id="needList" class="empty">暂无需求商单</div>
            </article>
        </section>
    </main>

    <script src="../js/api-utils.js"></script>
    <script>
        const STORAGE_KEYS = {
            sell: 'secondhand_sell_orders',
            need: 'secondhand_need_orders'
        };

        function readList(key) {
            const raw = localStorage.getItem(key);
            if (!raw) return [];
            try {
                const list = JSON.parse(raw);
                return Array.isArray(list) ? list : [];
            } catch (error) {
                return [];
            }
        }

        function writeList(key, list) {
            localStorage.setItem(key, JSON.stringify(list));
        }

        function renderCounts() {
            document.getElementById('sellCount').textContent = readList(STORAGE_KEYS.sell).length;
            document.getElementById('needCount').textContent = readList(STORAGE_KEYS.need).length;
        }

        function renderOneList(targetId, type, data) {
            const el = document.getElementById(targetId);
            if (!data.length) {
                el.className = 'empty';
                el.textContent = type === 'sell' ? '暂无二手商单' : '暂无需求商单';
                return;
            }

            el.className = '';
            el.innerHTML = data.map((item) => `
                <article class="order-item ${type}">
                    <p class="order-title">${item.title}</p>
                    <p class="order-meta">${type === 'sell' ? '售价' : '预算'}：${item.price || '-'}</p>
                    <p class="order-meta">分类：${item.category || '-'}</p>
                    <p class="order-meta">地点：${item.location || '-'}</p>
                    <p class="order-meta">联系：${item.contact || '-'}</p>
                    <p class="order-meta">${item.desc || '-'}</p>
                    <p class="order-muted">发布于：${item.createdAt}</p>
                    <div class="order-actions">
                        <button class="order-btn" data-type="${type}" data-id="${item.id}">删除</button>
                    </div>
                </article>
            `).join('');
        }

        function renderLists() {
            const sell = readList(STORAGE_KEYS.sell);
            const need = readList(STORAGE_KEYS.need);
            renderOneList('sellList', 'sell', sell);
            renderOneList('needList', 'need', need);
            renderCounts();
        }

        function createOrder(formValues) {
            return {
                id: Date.now() + Math.floor(Math.random() * 1000),
                ...formValues,
                createdAt: new Date().toLocaleString('zh-CN', { hour12: false })
            };
        }

        function submitSell(event) {
            event.preventDefault();
            const title = document.getElementById('sellTitle').value.trim();
            const price = document.getElementById('sellPrice').value.trim();
            const category = document.getElementById('sellCategory').value.trim();
            const location = document.getElementById('sellLocation').value.trim();
            const contact = document.getElementById('sellContact').value.trim();
            const desc = document.getElementById('sellDesc').value.trim();

            if (!title || !price) {
                showMessage('请至少填写商单标题和售价', 'warning');
                return;
            }

            const list = readList(STORAGE_KEYS.sell);
            list.unshift(createOrder({ title, price, category, location, contact, desc }));
            writeList(STORAGE_KEYS.sell, list);
            event.target.reset();
            renderLists();
            showMessage('二手物品商单发布成功', 'success');
        }

        function submitNeed(event) {
            event.preventDefault();
            const title = document.getElementById('needTitle').value.trim();
            const price = document.getElementById('needBudget').value.trim();
            const category = document.getElementById('needCategory').value.trim();
            const location = document.getElementById('needLocation').value.trim();
            const contact = document.getElementById('needContact').value.trim();
            const desc = document.getElementById('needDesc').value.trim();

            if (!title || !price) {
                showMessage('请至少填写需求标题和预算', 'warning');
                return;
            }

            const list = readList(STORAGE_KEYS.need);
            list.unshift(createOrder({ title, price, category, location, contact, desc }));
            writeList(STORAGE_KEYS.need, list);
            event.target.reset();
            renderLists();
            showMessage('二手需求商单发布成功', 'success');
        }

        function deleteOrder(type, id) {
            const key = type === 'sell' ? STORAGE_KEYS.sell : STORAGE_KEYS.need;
            const next = readList(key).filter((item) => Number(item.id) !== Number(id));
            writeList(key, next);
            renderLists();
            showMessage('已删除该条发布', 'info');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderLists();
            document.getElementById('sellForm').addEventListener('submit', submitSell);
            document.getElementById('needForm').addEventListener('submit', submitNeed);
            document.getElementById('sellList').addEventListener('click', (event) => {
                const target = event.target;
                if (target.tagName === 'BUTTON' && target.dataset.id) {
                    deleteOrder(target.dataset.type, target.dataset.id);
                }
            });
            document.getElementById('needList').addEventListener('click', (event) => {
                const target = event.target;
                if (target.tagName === 'BUTTON' && target.dataset.id) {
                    deleteOrder(target.dataset.type, target.dataset.id);
                }
            });
        });
    </script>
</body>
</html>
