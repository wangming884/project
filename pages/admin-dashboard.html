<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员后台 - 校园综合服务平台</title>
    <style>
        :root {
            --bg: #f3f6fb;
            --surface: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --brand: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
        .topbar { max-width: 1200px; margin: 0 auto; padding: 0.95rem 5%; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
        .topbar h1 { margin: 0; font-size: 1.2rem; }
        .topbar small { color: var(--muted); display: block; margin-top: 0.15rem; }
        .top-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
        .btn { border: none; border-radius: 10px; cursor: pointer; padding: 0.55rem 0.95rem; font-weight: 600; font-size: 0.88rem; text-decoration: none; display: inline-flex; align-items: center; }
        .btn-primary { background: var(--brand); color: #fff; }
        .btn-muted { background: #eef2ff; color: #3730a3; }
        .btn-danger { background: #fee2e2; color: #b91c1c; }
        .container { max-width: 1200px; margin: 1.2rem auto; padding: 0 5% 2rem; display: grid; gap: 1rem; }
        .cards { display: grid; gap: 0.9rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; }
        .card h3 { margin: 0 0 0.5rem; font-size: 0.96rem; color: var(--muted); }
        .card .num { font-size: 1.65rem; font-weight: 700; }
        .grid { display: grid; gap: 1rem; grid-template-columns: 1.3fr 1fr; }
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; }
        .panel h2 { margin: 0 0 0.7rem; font-size: 1rem; }
        .permissions { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0.6rem; }
        .perm-item { border: 1px dashed #bfdbfe; background: #eff6ff; border-radius: 10px; padding: 0.65rem; font-size: 0.88rem; color: #1e3a8a; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 640px; }
        th, td { text-align: left; border-bottom: 1px solid var(--border); padding: 0.65rem 0.4rem; font-size: 0.88rem; vertical-align: top; }
        th { color: var(--muted); font-weight: 600; }
        .ops { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .btn-ok, .btn-no { border: none; cursor: pointer; border-radius: 8px; padding: 0.35rem 0.55rem; font-size: 0.76rem; font-weight: 600; }
        .btn-ok { background: #dcfce7; color: #166534; }
        .btn-no { background: #fee2e2; color: #991b1b; }
        .empty { color: var(--muted); font-size: 0.9rem; padding: 0.5rem 0; }
        @media (max-width: 980px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="topbar">
            <div>
                <h1>管理员后台</h1>
                <small id="adminIdentity">正在校验管理员身份...</small>
            </div>
            <div class="top-actions">
                <a class="btn btn-muted" href="main.html">前台大厅</a>
                <button class="btn btn-primary" type="button" id="refreshBtn">刷新数据</button>
                <button class="btn btn-danger" type="button" id="logoutBtn">退出管理员</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="cards">
            <article class="card">
                <h3>待审核签到</h3>
                <div class="num" id="pendingCount">0</div>
            </article>
            <article class="card">
                <h3>二手商品总数</h3>
                <div class="num" id="secondhandCount">0</div>
            </article>
            <article class="card">
                <h3>代课任务总数</h3>
                <div class="num" id="taskCount">0</div>
            </article>
            <article class="card">
                <h3>管理员权限</h3>
                <div class="num" style="color:#2563eb;">ALL</div>
            </article>
        </section>

        <section class="grid">
            <article class="panel">
                <h2>签到审核中心</h2>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>位置</th>
                                <th>签到时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="pendingTableBody">
                            <tr><td colspan="5" class="empty">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </article>

            <aside class="panel">
                <h2>管理员权限清单</h2>
                <div class="permissions">
                    <div class="perm-item">审核晚寝签到</div>
                    <div class="perm-item">查看全站任务</div>
                    <div class="perm-item">管理二手商品</div>
                    <div class="perm-item">访问全模块页面</div>
                    <div class="perm-item">执行状态变更操作</div>
                    <div class="perm-item">管理员专属登录态</div>
                </div>
                <p class="empty" style="margin-top:0.8rem;">提示：管理员登录后签发专属 token，并具备超级权限（后端 `userId=0`）。</p>
            </aside>
        </section>
    </main>

    <script src="../js/api-config.js"></script>
    <script src="../js/api-utils.js"></script>
    <script src="../js/admin-auth.js"></script>
    <script>
        let pendingRecords = [];

        function extractRows(payload) {
            if (!payload) return [];
            if (Array.isArray(payload)) return payload;
            if (Array.isArray(payload.records)) return payload.records;
            if (Array.isArray(payload.list)) return payload.list;
            if (payload.data) return extractRows(payload.data);
            return [];
        }

        function extractTotal(payload, rows) {
            if (!payload) return rows.length;
            if (typeof payload.total === 'number') return payload.total;
            if (payload.data) return extractTotal(payload.data, rows);
            return rows.length;
        }

        function renderPendingTable() {
            const body = document.getElementById('pendingTableBody');
            if (!pendingRecords.length) {
                body.innerHTML = '<tr><td colspan="5" class="empty">当前没有待审核记录</td></tr>';
                return;
            }

            body.innerHTML = pendingRecords.map((item) => `
                <tr>
                    <td>${item.id ?? '-'}</td>
                    <td>${item.username ?? '-'}</td>
                    <td>${item.location ?? '-'}</td>
                    <td>${item.checkinTime ?? '-'}</td>
                    <td>
                        <div class="ops">
                            <button type="button" class="btn-ok" data-id="${item.id}" data-status="approved">通过</button>
                            <button type="button" class="btn-no" data-id="${item.id}" data-status="rejected">驳回</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function reviewCheckin(recordId, status) {
            try {
                showLoading('提交审核中...');
                const url = `${API_ENDPOINTS.admin.checkinApproveBase}/${recordId}`;
                const response = await post(url, {
                    status,
                    reviewRemark: status === 'approved' ? '管理员审核通过' : '管理员审核驳回',
                });
                hideLoading();

                if (!response.success) {
                    showMessage(response.message || '审核失败', 'error');
                    return;
                }

                showMessage(status === 'approved' ? '审核通过成功' : '驳回成功', 'success');
                await loadDashboardData();
            } catch (error) {
                hideLoading();
                handleError(error, '审核失败');
            }
        }

        async function loadDashboardData() {
            const token = getStorage('authToken');
            if (!token) {
                showMessage('当前为离线模式，部分后台数据不可用', 'warning');
            }

            try {
                const [pendingRes, productRes, taskRes] = await Promise.all([
                    get(API_ENDPOINTS.admin.checkinPending, { page: 1, pageSize: 20 }),
                    get(API_ENDPOINTS.admin.secondhandProducts, { page: 1, pageSize: 1 }),
                    get(API_ENDPOINTS.admin.substituteTasks, { page: 1, pageSize: 1 }),
                ]);

                pendingRecords = extractRows(pendingRes?.data);
                renderPendingTable();
                document.getElementById('pendingCount').textContent = extractTotal(pendingRes?.data, pendingRecords);

                const productRows = extractRows(productRes?.data);
                document.getElementById('secondhandCount').textContent = extractTotal(productRes?.data, productRows);

                const taskRows = extractRows(taskRes?.data);
                document.getElementById('taskCount').textContent = extractTotal(taskRes?.data, taskRows);
            } catch (error) {
                renderPendingTable();
                showMessage('后台数据加载失败，请检查后端是否已启动', 'warning');
            }
        }

        function initAdminIdentity() {
            const session = getAdminSession();
            const modeText = session?.mode === 'offline' ? '离线模式' : '服务端模式';
            document.getElementById('adminIdentity').textContent = `当前管理员：${session?.username || '未知'} · ${modeText}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAdminAuth()) {
                return;
            }

            initAdminIdentity();
            loadDashboardData();

            document.getElementById('refreshBtn').addEventListener('click', loadDashboardData);
            document.getElementById('logoutBtn').addEventListener('click', adminLogout);
            document.getElementById('pendingTableBody').addEventListener('click', (event) => {
                const target = event.target;
                const recordId = target.dataset.id;
                const status = target.dataset.status;
                if (!recordId || !status) {
                    return;
                }
                reviewCheckin(recordId, status);
            });
        });
    </script>
</body>
</html>
